name: avucici_app
description: "Avuç içi biyometrik ödeme sistemi"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.12.0
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.11.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  image: ^4.1.7
  permission_handler: ^11.3.1
  lottie: ^3.1.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#0D0D0D"
  image: assets/images/splash_logo.png
  color_dark: "#0D0D0D"
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#0D0D0D"
    image: assets/images/splash_logo.png
    icon_background_color: "#0D0D0D"
    color_dark: "#0D0D0D"
    image_dark: assets/images/splash_logo.png
    icon_background_color_dark: "#0D0D0D"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/models/avucici_model.tflite
    - assets/images/
    - assets/sounds/
